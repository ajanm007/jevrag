[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jevrag"
version = "0.1.0"
description = "A decision-native RAG controller: state -> Decision -> confidence -> action"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy", "typesafe-sdk"]
authors = [
    { name = "Anmol Sethi", email = "ajanmol3404@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/ajanm007/jevrag"
Repository = "https://github.com/ajanm007/jevrag"

[project.scripts]
jevrag = "jevrag.__main__:main"

[tool.setuptools.packages.find]
include = ["jevrag*"]
