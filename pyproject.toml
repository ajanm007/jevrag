[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jevrag"
version = "0.2.0"
description = "A decision-native RAG controller: state -> Decision -> confidence -> action"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy", "typesafe-sdk"]
authors = [
    { name = "Anmol Sethi", email = "ajanmol3404@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Test-only deps (NOT runtime): pytest for the suite, rag-jev for the
# wrapped-adapter comparison test, rank_bm25 + pypdf for the
# benchmark-retrieval tests. typesafe-sdk is already a runtime dependency
# numpy is pinned to 2.3.5 TEMPORARILY and only here (runtime stays
# unpinned): jevrag/_vendor/selective.py calls np.trapz, which NumPy
# removed after 2.3.x, breaking AURC on newer versions. The one-line fix
# (np.trapezoid) lives in _vendor/ and is out of scope for the packet
# that added this pin — see REPORT_MUSE_25.md. Do not "fix" CI by
# widening this pin; fix selective.py instead, then unpin here.
[project.optional-dependencies]
test = ["pytest", "rag-jev", "rank-bm25", "pypdf", "numpy==2.3.5"]
# RAGAS is a real, optional *benchmark* dependency (packet CLINE_24): heavy
# (pulls the langchain stack) and its faithfulness metric needs live
# LLM-judge calls, so it is deliberately NOT in `test` — CI installs `.[test]`
# and must stay fast and key-free. Only scripts/eval_ragas_faithfulness.py
# imports it, lazily, with a clear error when absent.
ragas = [
    "ragas==0.4.3",
    # ragas 0.4.3 declares the langchain stack UNVERSIONED, but its
    # ragas/llms/base.py still does `from langchain_community.chat_models.
    # vertexai import ChatVertexAI` — which the langchain 1.x line
    # (langchain-community >= 0.4) removed. pip's default resolution therefore
    # yields a stack where even `import ragas` raises ModuleNotFoundError
    # (verified 2026-09-22). These pins restore a compatible 0.3-line stack.
    "langchain<1.0",
    "langchain-core<1.0",
    "langchain-community<0.4",
    "langchain-openai<1.0",
]

[project.urls]
Homepage = "https://github.com/ajanm007/jevrag"
Repository = "https://github.com/ajanm007/jevrag"

[project.scripts]
jevrag = "jevrag.__main__:main"

[tool.setuptools.packages.find]
include = ["jevrag*"]
